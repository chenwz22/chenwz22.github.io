<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Site</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 自定义样式 -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #4CAF50;
            margin-top: 50px;
        }
        p {
            color: #333;
            font-size: 18px;
            margin-top: 20px;
        }
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-1">
                <h1 class="mt-5">Welcome to Weizhe's GitHub Pages Website!</h1>
                <p class="lead">This is my personal website hosted on GitHub Pages.</p>
                <p class="lead">I am a PhD student at Tsinghua University, majoring in biology.</p>
                <p class="lead">I research in Drosophila and Aedes.</p>
                <p class="lead">This is my friend:</p>
                <img src="ginger.png" alt="My friend" class="img-fluid" width="400">
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Weizhe</p>
    </footer>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
